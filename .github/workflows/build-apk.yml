name: Build BillingPro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract BillingPro
        run: |
          unzip -q BillingPro_3.0.zip -d billingpro
          find billingpro -maxdepth 2 -type f | head -50

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor
        working-directory: billingpro
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npx cap init BillingPro com.billingpro.app --web-dir=.

      - name: Add Android
        working-directory: billingpro
        run: npx cap add android

      - name: Sync Android
        working-directory: billingpro
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        working-directory: billingpro/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BillingPro-APK
          path: billingpro/android/app/build/outputs/apk/debug/app-debug.apk
